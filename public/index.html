<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>RentPilot</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Inter, system-ui, sans-serif;
      background: #f7f8fc;
    }

    .card {
      background: white;
      border: 1px solid #e8eaf0;
      border-radius: 18px;
      box-shadow: 0 8px 28px rgba(15, 23, 42, 0.04);
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="login" class="min-h-screen grid place-items-center p-6">
    <form id="lf" class="card p-8 w-full max-w-md space-y-4">

      <div>
        <h1 class="text-3xl font-bold text-slate-900">
          RentPilot
        </h1>

        <p class="text-slate-500 mt-1">
          Owner rental management
        </p>
      </div>

      <input
        id="email"
        type="email"
        required
        autocomplete="email"
        placeholder="Owner email"
        class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-500"
      >

      <input
        id="pw"
        type="password"
        required
        autocomplete="current-password"
        placeholder="Password"
        class="w-full border border-slate-200 rounded-xl p-3 outline-none focus:ring-2 focus:ring-indigo-500"
      >

      <button
        id="loginBtn"
        type="submit"
        class="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl p-3 font-semibold"
      >
        Sign in
      </button>

      <div id="lm" class="text-red-600 text-sm"></div>

    </form>
  </div>


  <!-- APPLICATION -->
  <div id="app" class="hidden">

    <!-- SIDEBAR -->
    <aside class="hidden lg:block fixed inset-y-0 w-64 bg-white border-r p-6">

      <h1 class="text-2xl font-bold mb-8">
        RentPilot
      </h1>

      <nav class="space-y-2">

        <button
          onclick="show('dashboard')"
          class="w-full text-left p-3 rounded-xl hover:bg-indigo-50"
        >
          Dashboard
        </button>

        <button
          onclick="show('flats')"
          class="w-full text-left p-3 rounded-xl hover:bg-indigo-50"
        >
          Flats
        </button>

        <button
          onclick="show('tenants')"
          class="w-full text-left p-3 rounded-xl hover:bg-indigo-50"
        >
          Tenants
        </button>

        <button
          onclick="show('payments')"
          class="w-full text-left p-3 rounded-xl hover:bg-indigo-50"
        >
          Payments
        </button>

        <button
          onclick="show('bills')"
          class="w-full text-left p-3 rounded-xl hover:bg-indigo-50"
        >
          Bills
        </button>

        <a
          id="export"
          href="#"
          class="block p-3 rounded-xl hover:bg-indigo-50"
        >
          Export Excel
        </a>

        <button
          id="logoutBtn"
          class="w-full text-left p-3 text-red-600 hover:bg-red-50 rounded-xl"
        >
          Logout
        </button>

      </nav>
    </aside>


    <!-- MAIN -->
    <main class="lg:ml-64 p-5 md:p-8 max-w-7xl">

      <h2 id="title" class="text-3xl font-bold mb-7">
        Dashboard
      </h2>


      <!-- DASHBOARD -->
      <section id="dashboard">

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">

          <div class="card p-5">
            <span class="text-slate-500 text-sm">
              Total Flats
            </span>

            <b id="s1" class="block text-3xl mt-2">
              0
            </b>
          </div>


          <div class="card p-5">
            <span class="text-slate-500 text-sm">
              Occupied
            </span>

            <b id="s2" class="block text-3xl mt-2">
              0
            </b>
          </div>


          <div class="card p-5">
            <span class="text-slate-500 text-sm">
              Collection
            </span>

            <b id="s3" class="block text-3xl mt-2">
              ₹0
            </b>
          </div>


          <div class="card p-5">
            <span class="text-slate-500 text-sm">
              Pending Dues
            </span>

            <b id="s4" class="block text-3xl mt-2">
              ₹0
            </b>
          </div>

        </div>


        <div class="card p-6 mt-5">

          <h3 class="font-bold text-xl">
            Flat Overview
          </h3>

          <div
            id="cards"
            class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-5"
          ></div>

        </div>

      </section>


      <!-- FLATS -->
      <section
        id="flats"
        class="hidden card p-6"
      >
        <h3 class="font-bold text-xl">
          Flats
        </h3>

        <div id="fl"></div>
      </section>


      <!-- TENANTS -->
      <section
        id="tenants"
        class="hidden card p-6"
      >
        <h3 class="font-bold text-xl">
          Tenants
        </h3>

        <div id="tn"></div>
      </section>


      <!-- PAYMENTS -->
      <section
        id="payments"
        class="hidden card p-6"
      >
        <h3 class="font-bold text-xl">
          Payments
        </h3>

        <div id="py"></div>
      </section>


      <!-- BILLS -->
      <section
        id="bills"
        class="hidden card p-6"
      >
        <h3 class="font-bold text-xl">
          Bills
        </h3>

        <div id="bi"></div>
      </section>

    </main>

  </div>


  <!-- APP JAVASCRIPT -->
  <script src="/app.js"></script>

</body>
</html>
