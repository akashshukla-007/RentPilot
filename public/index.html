<!doctype html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>RentPilot</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{font-family:Inter,system-ui;background:#f7f8fc}.card{background:#fff;border:1px solid #e8eaf0;border-radius:18px;box-shadow:0 8px 28px #0f172a0a}</style></head><body>
<div id="login" class="min-h-screen grid place-items-center p-6"><form id="lf" class="card p-8 w-full max-w-md space-y-4"><h1 class="text-3xl font-bold">RentPilot</h1><p class="text-slate-500">Owner rental management</p><input id="email" type="email" required placeholder="Owner email" class="w-full border rounded-xl p-3"><input id="pw" type="password" required placeholder="Password" class="w-full border rounded-xl p-3"><button class="w-full bg-indigo-600 text-white rounded-xl p-3">Sign in</button><div id="lm" class="text-red-600 text-sm"></div></form></div>
<div id="app" class="hidden"><aside class="hidden lg:block fixed inset-y-0 w-64 bg-white border-r p-6"><h1 class="text-2xl font-bold mb-8">RentPilot</h1><nav class="space-y-2"><button onclick="show('dashboard')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Dashboard</button><button onclick="show('flats')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Flats</button><button onclick="show('tenants')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Tenants</button><button onclick="show('payments')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Payments</button><button onclick="show('bills')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Bills</button><a id="export" class="block p-3 rounded-xl hover:bg-indigo-50">Export Excel</a><button onclick="sb.auth.signOut()" class="w-full text-left p-3 text-red-600">Logout</button></nav></aside>
<main class="lg:ml-64 p-5 md:p-8 max-w-7xl"><h2 id="title" class="text-3xl font-bold mb-7">Dashboard</h2><section id="dashboard"><div class="grid grid-cols-2 lg:grid-cols-4 gap-4"><div class="card p-5">Total Flats<b id="s1" class="block text-3xl mt-2">0</b></div><div class="card p-5">Occupied<b id="s2" class="block text-3xl mt-2">0</b></div><div class="card p-5">Collection<b id="s3" class="block text-3xl mt-2">₹0</b></div><div class="card p-5">Pending Dues<b id="s4" class="block text-3xl mt-2">₹0</b></div></div><div class="card p-6 mt-5"><h3 class="font-bold">Flat Overview</h3><div id="cards" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-5"></div></div></section><section id="flats" class="hidden card p-6"><h3 class="font-bold text-xl">Flats</h3><div id="fl"></div></section><section id="tenants" class="hidden card p-6"><h3 class="font-bold text-xl">Tenants</h3><div id="tn"></div></section><section id="payments" class="hidden card p-6"><h3 class="font-bold text-xl">Payments</h3><div id="py"></div></section><section id="bills" class="hidden card p-6"><h3 class="font-bold text-xl">Bills</h3><div id="bi"></div></section></main></div>
<script>
let sb,state={};const $=x=>document.getElementById(x),money=n=>"₹"+Number(n||0).toLocaleString("en-IN",{maximumFractionDigits:2}),esc=x=>String(x??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",""":"&quot;","'":"&#39;"}[c]));
async function init(){const c=await fetch("/api/config").then(r=>r.json());sb=window.supabase.createClient(c.supabaseUrl,c.supabaseAnonKey);const x=await sb.auth.getSession();if(x.data.session)enter();sb.auth.onAuthStateChange((e,s)=>{if(e==="SIGNED_IN"&&s)enter()})}async function enter(){$("login").classList.add("hidden");$("app").classList.remove("hidden");$("export").href="/api/export/payments";await load()}async function api(u){const x=await sb.auth.getSession();const r=await fetch(u,{headers:{Authorization:"Bearer "+x.data.session.access_token}});const j=await r.json();if(!r.ok)throw Error(j.error);return j}async function load(){state=await api("/api/dashboard");const s=state.stats;$("s1").textContent=s.totalFlats;$("s2").textContent=s.occupied;$("s3").textContent=money(s.monthlyCollection);$("s4").textContent=money(s.pendingDues);$("cards").innerHTML=state.flats.map(f=>{const t=state.tenants.find(x=>x.flat_id===f.id),b=state.bills.find(x=>x.flat_id===f.id);return `<div class="border rounded-2xl p-4"><b>Flat ${esc(f.flat_number)}</b><span class="float-right">${esc(f.status)}</span><p class="text-sm text-slate-500 mt-3">${t?esc(t.name):"No active tenant"}</p><div class="flex justify-between mt-4">Rent <b>${money(f.monthly_rent)}</b></div><div class="flex justify-between">Due <b>${money(b?.total_due)}</b></div></div>`}).join("");$("fl").innerHTML=tbl(["Flat","Rent","Rate","Status"],state.flats.map(f=>[f.flat_number,money(f.monthly_rent),money(f.electricity_rate),f.status]));$("tn").innerHTML=tbl(["Name","Mobile","Flat"],state.tenants.map(t=>[t.name,t.mobile,state.flats.find(f=>f.id===t.flat_id)?.flat_number||"-"]));$("py").innerHTML=tbl(["Date","Amount","Mode"],state.payments.map(p=>[p.payment_date,money(p.amount),p.mode]));$("bi").innerHTML=tbl(["Month","Flat","Due","Status"],state.bills.map(b=>[b.month,state.flats.find(f=>f.id===b.flat_id)?.flat_number||"-",money(b.total_due),b.status]))}function tbl(h,r){return `<div class="overflow-auto mt-5"><table class="min-w-full text-sm"><thead><tr class="border-b">${h.map(x=>`<th class="p-3 text-left">${x}</th>`).join("")}</tr></thead><tbody>${r.map(a=>`<tr class="border-b">${a.map(x=>`<td class="p-3">${esc(x)}</td>`).join("")}</tr>`).join("")}</tbody></table></div>`}function show(x){["dashboard","flats","tenants","payments","bills"].forEach(y=>$(y).classList.toggle("hidden",y!==x));$("title").textContent=x[0].toUpperCase()+x.slice(1)}$("lf").onsubmit=async e=>{e.preventDefault();const r=await sb.auth.signInWithPassword({email:$("email").value,password:$("pw").value});if(r.error)$("lm").textContent=r.error.message};init();
</script></body></html>
