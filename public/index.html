<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RentPilot</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{font-family:Inter,system-ui,sans-serif;background:#f7f8fc}.card{background:#fff;border:1px solid #e8eaf0;border-radius:18px;box-shadow:0 8px 28px rgba(15,23,42,.04)}
.modal{background:rgba(15,23,42,.45);backdrop-filter:blur(3px)}
.input{width:100%;border:1px solid #dfe3eb;border-radius:12px;padding:.7rem .8rem;outline:0;background:#fff}
.input:focus{border-color:#6366f1;box-shadow:0 0 0 3px rgba(99,102,241,.12)}
.btn{border-radius:12px;padding:.65rem 1rem;font-weight:600}.primary{background:#4f46e5;color:#fff}.primary:hover{background:#4338ca}
</style>
</head>
<body>
<div id="login" class="min-h-screen grid place-items-center p-6">
<form id="lf" class="card p-8 w-full max-w-md space-y-4">
<div><h1 class="text-3xl font-bold">RentPilot</h1><p class="text-slate-500 mt-1">Owner rental management</p></div>
<input id="email" type="email" required placeholder="Owner email" class="input">
<input id="pw" type="password" required placeholder="Password" class="input">
<button id="loginBtn" class="btn primary w-full">Sign in</button><div id="lm" class="text-red-600 text-sm"></div>
</form></div>

<div id="app" class="hidden">
<aside class="hidden lg:block fixed inset-y-0 w-64 bg-white border-r p-6">
<h1 class="text-2xl font-bold mb-8">RentPilot</h1>
<nav class="space-y-2">
<button onclick="show('dashboard')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Dashboard</button>
<button onclick="show('flats')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Flats</button>
<button onclick="show('tenants')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Tenants</button>
<button onclick="show('payments')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Payments</button>
<button onclick="show('bills')" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Bills</button>
<button onclick="exportExcel()" class="w-full text-left p-3 rounded-xl hover:bg-indigo-50">Export Excel</button>
<button id="logoutBtn" class="w-full text-left p-3 text-red-600 hover:bg-red-50 rounded-xl">Logout</button>
</nav>
</aside>

<main class="lg:ml-64 p-5 md:p-8 max-w-7xl">
<div class="flex flex-wrap items-center justify-between gap-3 mb-7">
<h2 id="title" class="text-3xl font-bold">Dashboard</h2>
<div class="flex gap-2">
<button id="quickAdd" onclick="quickAction()" class="btn primary hidden sm:inline-flex">+ Add</button>
<button onclick="load()" class="btn bg-white border border-slate-200">Refresh</button>
</div></div>

<section id="dashboard">
<div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
<div class="card p-5"><span class="text-slate-500 text-sm">Total Flats</span><b id="s1" class="block text-3xl mt-2">0</b></div>
<div class="card p-5"><span class="text-slate-500 text-sm">Occupied</span><b id="s2" class="block text-3xl mt-2">0</b></div>
<div class="card p-5"><span class="text-slate-500 text-sm">Collection</span><b id="s3" class="block text-3xl mt-2">₹0</b></div>
<div class="card p-5"><span class="text-slate-500 text-sm">Pending Dues</span><b id="s4" class="block text-3xl mt-2">₹0</b></div>
</div>
<div class="card p-6 mt-5"><div class="flex justify-between"><h3 class="font-bold text-xl">Flat Overview</h3></div><div id="cards" class="grid sm:grid-cols-2 xl:grid-cols-3 gap-4 mt-5"></div></div>
</section>

<section id="flats" class="hidden card p-6"><div class="flex justify-between items-center gap-3"><h3 class="font-bold text-xl">Flats</h3><button onclick="openFlat()" class="btn primary">+ Add Flat</button></div><div id="fl" class="mt-4"></div></section>
<section id="tenants" class="hidden card p-6"><div class="flex justify-between items-center gap-3"><h3 class="font-bold text-xl">Tenants</h3><button onclick="openTenant()" class="btn primary">+ Add Tenant</button></div><div id="tn" class="mt-4"></div></section>
<section id="payments" class="hidden card p-6"><div class="flex justify-between items-center gap-3"><h3 class="font-bold text-xl">Payments</h3><button onclick="openPayment()" class="btn primary">+ Record Payment</button></div><div id="py" class="mt-4"></div></section>
<section id="bills" class="hidden card p-6"><div class="flex justify-between items-center gap-3"><h3 class="font-bold text-xl">Bills</h3><button onclick="openBill()" class="btn primary">+ Generate Bill</button></div><div id="bi" class="mt-4"></div></section>
</main></div>

<div id="modal" class="modal fixed inset-0 hidden items-center justify-center p-4 z-50">
<div class="bg-white rounded-2xl w-full max-w-lg max-h-[90vh] overflow-auto p-6">
<div class="flex justify-between items-center mb-5"><h3 id="modalTitle" class="text-xl font-bold"></h3><button onclick="closeModal()" class="text-2xl text-slate-400">&times;</button></div>
<form id="modalForm" class="space-y-4"></form>
</div></div>

<div id="toast" class="fixed bottom-5 right-5 hidden z-[60]"></div>
<script src="/app.js"></script>
</body></html>
